<div class="login-container">
  <div class="login-card">
    <img src="/logo.png" alt="logo" class="login-logo">
    <h1>GestMaquette</h1>
    <p class="login-subtitle">Connectez-vous pour continuer</p>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="votre@email.fr" required>
      </div>

      <div class="form-group">
        <label for="motDePasse">Mot de passe</label>
        <input id="motDePasse" type="password" [(ngModel)]="motDePasse" name="motDePasse" placeholder="Mot de passe"
          required>
      </div>

      @if (erreur) {
      <p class="login-erreur">{{ erreur }}</p>
      }

      <button type="submit">Se connecter</button>
    </form>

    <div class="demo-section">
      <p class="demo-title">Comptes de démonstration</p>
      <div class="demo-comptes">
        <div class="demo-compte" (click)="remplirDemo('admin@gestmaquette.fr', 'admin123')">
          <span class="demo-role">Admin</span>
          <span class="demo-email">admin&#64;gestmaquette.fr</span>
          <span class="demo-mdp">admin123</span>
        </div>
        <div class="demo-compte" (click)="remplirDemo('secretaire@gestmaquette.fr', 'secretaire123')">
          <span class="demo-role">Secrétaire</span>
          <span class="demo-email">secretaire&#64;gestmaquette.fr</span>
          <span class="demo-mdp">secretaire123</span>
        </div>
        <div class="demo-compte" (click)="remplirDemo('responsable@gestmaquette.fr', 'responsable123')">
          <span class="demo-role">Responsable</span>
          <span class="demo-email">responsable&#64;gestmaquette.fr</span>
          <span class="demo-mdp">responsable123</span>
        </div>
      </div>
    </div>
  </div>
</div>
